<!DOCTYPE html>
<html lang="si">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-guard.js"></script>
    <title>Advanced Level - ExamPaperLK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="font-sans text-gray-800 antialiased bg-gray-50/30">

    <!-- Navigation (injected by components.js) -->
    <div id="nav-container"></div>

    <!-- Header Section -->
    <div id="page-header"></div>

    <!-- Subjects Grid -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-32">
        <div id="subjects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Dynamically populated from siteConfig.subjects['AL'] -->
        </div>
    </section>

    <!-- Global Footer -->
    <footer></footer>

    <script src="data.js"></script>
    <script src="count-papers.js"></script>
    <script src="components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Inject shared page header
            document.getElementById('page-header').innerHTML = Components.pageHeader({
                badge: 'Premium Archives',
                title: 'G.C.E. Advanced Level',
                description: 'The most comprehensive collection of A/L past papers in the country.'
            });

            // Render subject grid using shared utility
            Components.renderSubjectGrid('subjects-grid', 'AL');
        });
    </script>
</body>

</html>
