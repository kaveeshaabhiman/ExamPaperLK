<!DOCTYPE html>
<html lang="si">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-guard.js"></script>
    <title>More Categories - ExamPaperLK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="font-sans text-gray-800 antialiased overflow-x-hidden bg-gray-50/10">

    <!-- Navigation (injected by components.js) -->
    <div id="nav-container"></div>

    <!-- Header -->
    <div id="page-header"></div>

    <!-- Categories Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 pb-32">
        <div id="more-categories-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Dynamically Build from siteConfig.categories -->
        </div>
    </main>

    <!-- Global Footer -->
    <footer></footer>

    <script src="data.js"></script>
    <script src="count-papers.js"></script>
    <script src="components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Inject shared page header
            document.getElementById('page-header').innerHTML = Components.pageHeader({
                badge: 'Complete Archives',
                title: 'Explore More Papers',
                description: 'Browse through our entire collection of exams, term tests, and model papers across all levels.'
            });

            // Render category grid using shared utility
            Components.renderCategoryGrid('more-categories-grid');
        });
    </script>
</body>

</html>
